ci:
  autoupdate_schedule: monthly
  # uv-audit queries api.osv.dev for CVEs. pre-commit.ci blocks outbound
  # network during hook execution, so the GHA audit job in test.yaml runs it instead.
  skip: [uv-audit]

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/PyCQA/flake8
    rev: cfbbfdeb2391c14a37e101e92a77f54f329e1726  # frozen: 7.4.1
    hooks:
      - id: flake8
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/awslabs/cfn-python-lint
    rev: f106483a0a0a720436e850cf90a4a7950ffece08  # frozen: v1.58.0
    hooks:
      - id: cfn-python-lint
        args:
          - "-i=E1001"
        exclude: |
          (?x)(
            ^.venv/|
            ^tests/|
            ^docker/|
            ^temp/|
            ^.github/|
            ^.pre-commit-config.yaml
          )
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: dd409d04a3fa4a50f918dddb3ad3c6d8f46ab2cd  # frozen: 0.13.4
    hooks:
      - id: uv-lock
      # Runs locally when uv.lock, pyproject.toml, or uv.toml are part of
      # the commit, and on every PR via the GHA audit job in test.yaml.
      # Skipped on pre-commit.ci (see ci.skip comment above).
      - id: uv-audit
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
