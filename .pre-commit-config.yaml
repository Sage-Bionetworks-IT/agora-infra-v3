ci:
  autoupdate_schedule: monthly
  # uv-audit queries api.osv.dev for CVEs. pre-commit.ci blocks outbound
  # network during hook execution, so the GHA audit job in test.yaml runs it instead.
  skip: [uv-audit]

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/PyCQA/flake8
    rev: 960c1d286190804104f7255b97da034446fdaac3  # frozen: 7.5.0
    hooks:
      - id: flake8
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/awslabs/cfn-python-lint
    rev: 8e57b66c2d2c9a0abb126286552ca20d037f38b5  # frozen: v1.59.0
    hooks:
      - id: cfn-python-lint
        args:
          - "-i=E1001"
        exclude: |
          (?x)(
            ^.venv/|
            ^tests/|
            ^docker/|
            ^temp/|
            ^.github/|
            ^.pre-commit-config.yaml
          )
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88  # frozen: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 46787482b9fb2003c56e0f7592e312ef381829d9  # frozen: 0.13.6
    hooks:
      - id: uv-lock
      # Runs locally when uv.lock, pyproject.toml, or uv.toml are part of
      # the commit, and on every PR via the GHA audit job in test.yaml.
      # Skipped on pre-commit.ci (see ci.skip comment above).
      - id: uv-audit
  - repo: https://github.com/sirosen/check-jsonschema
    rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
    hooks:
      - id: check-github-workflows
      - id: check-github-actions
