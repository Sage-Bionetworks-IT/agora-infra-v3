name: deploy-dev

on:
  push:
    branches: ['dev']
  workflow_dispatch:

# id-token:write is required by the reusable aws-deploy workflow for OIDC.
permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      environment: dev
  aws-deploy:
    uses: "./.github/workflows/aws-deploy.yaml"
    with:
      role-to-assume: "arn:aws:iam::607346494281:role/sagebase-github-oidc-agora-infra-v3"
      role-session-name: ${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ github.run_id }}
      environment: dev
