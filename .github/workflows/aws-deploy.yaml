# reusable template for deployments to AWS accounts
name: aws-deploy

# Ensures that only one deploy task per branch/environment will run at a time.
concurrency:
  group: ${{ inputs.aws-environment }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      aws-region:
        type: string
        default: us-east-1
      role-to-assume:
        required: true
        type: string
      role-session-name:
        required: true
        type: string
      role-duration-seconds:
        type: number
        default: 3600
      aws-environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    environment: ${{ inputs.aws-environment }}
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.aws-environment }}
      - name: Install AWS CLI
        run: sudo snap install aws-cli --classic
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@2.1135.1 --ignore-scripts
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          checksum: "6681d691eb7f9c00ac6a3af54252f7ab29ae72f0c8f95bdc7f9d1401c23ea868"
      - name: Install python dependencies
        run: uv sync --frozen --no-group dev
      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.role-to-assume }}
          role-session-name: ${{ inputs.role-session-name }}
          role-duration-seconds: ${{ inputs.role-duration-seconds }}
      - name: CDK deploy
        run: uv run cdk deploy --all --debug --concurrency 5 --require-approval never
        env:
          ENV: ${{ inputs.aws-environment }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
