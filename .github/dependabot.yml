version: 2
updates:
  # Keep GitHub Actions pinned-SHA references current. Dependabot understands
  # the `uses: owner/repo@<sha> # vX.Y.Z` pattern and will bump both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Python runtime dependencies.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
